<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ServerStats Dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #5ee6a5;
    --accent2: #6ea8fe;
    --text: #e6e8eb;
    --muted: #8b909a;
    --border: #262a33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 8px;
  }
  h1 { margin: 0; font-size: 22px; }
  h1 span { color: var(--accent); }
  #meta { color: var(--muted); font-size: 13px; }
  .grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
  }
  @media (max-width: 800px) {
    .grid { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .card h2 {
    margin: 0 0 12px 0;
    font-size: 14px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  .kd { color: var(--accent); font-weight: 600; }
  .event-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .event-row:last-child { border-bottom: none; }
  .event-type { color: var(--accent2); font-weight: 600; }
  .event-time { color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 20px; }
</style>
</head>
<body>

<header>
  <h1>🎮 <span id="server-name">Server</span>Stats</h1>
  <div id="meta">loading…</div>
</header>

<div class="grid">
  <div class="card">
    <h2>Players</h2>
    <table id="players-table">
      <thead>
        <tr><th>Name</th><th>Playtime</th><th>K/D</th><th>Kills</th><th>Deaths</th><th>Blocks</th></tr>
      </thead>
      <tbody id="players-body"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>Recent Activity</h2>
    <div id="events-list"></div>
  </div>
</div>

<script>
const REFRESH_MS = 5000;

function fmtPlaytime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

function fmtTimeAgo(unixSeconds) {
  const diff = Math.floor(Date.now() / 1000) - unixSeconds;
  if (diff < 60) return `${diff}s ago`;
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  return `${Math.floor(diff / 86400)}d ago`;
}

const eventEmoji = { join: '🟢', leave: '🔴', kill: '⚔️', death: '💀' };

async function refresh() {
  try {
    const [players, events, meta] = await Promise.all([
      fetch('/api/players').then(r => r.json()),
      fetch('/api/events').then(r => r.json()),
      fetch('/api/meta').then(r => r.json())
    ]);

    document.getElementById('server-name').textContent = meta.server_name || 'Server';
    document.getElementById('meta').textContent = 'Live · updated ' + new Date().toLocaleTimeString();

    const body = document.getElementById('players-body');
    if (players.length === 0) {
      body.innerHTML = '<tr><td colspan="6" class="empty">No player data yet — join the server!</td></tr>';
    } else {
      body.innerHTML = players.map(p => {
        const kd = p.deaths > 0 ? (p.kills / p.deaths).toFixed(2) : p.kills.toFixed(2);
        return `<tr>
          <td>${escapeHtml(p.name)}</td>
          <td>${fmtPlaytime(p.playtime_seconds)}</td>
          <td class="kd">${kd}</td>
          <td>${p.kills}</td>
          <td>${p.deaths}</td>
          <td>${p.blocks_broken + p.blocks_placed}</td>
        </tr>`;
      }).join('');
    }

    const list = document.getElementById('events-list');
    if (events.length === 0) {
      list.innerHTML = '<div class="empty">No activity yet</div>';
    } else {
      list.innerHTML = events.map(e => `
        <div class="event-row">
          <span>${eventEmoji[e.type] || '•'} <b>${escapeHtml(e.player)}</b> ${describeEvent(e)}</span>
          <span class="event-time">${fmtTimeAgo(e.timestamp)}</span>
        </div>
      `).join('');
    }
  } catch (err) {
    document.getElementById('meta').textContent = 'Connection lost — retrying…';
    console.error(err);
  }
}

function describeEvent(e) {
  switch (e.type) {
    case 'join': return 'joined';
    case 'leave': return 'left';
    case 'kill': return e.detail;
    case 'death': return 'died';
    default: return e.detail || '';
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>

</body>
</html>
